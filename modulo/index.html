  <style>
    :root {
      --petrol:      #0a1f21;
      --petrol-mid:  #0e282b;
      --petrol-lt:   #143438;
      --vermillion:  #e8401f;
      --sinal:       #6fb5ac;
      --cream:       #f2ede3;
      --cream-60:    rgba(242,237,227,.6);
      --cream-35:    rgba(242,237,227,.35);
      --cream-15:    rgba(242,237,227,.15);
      --font-d: "Archivo", sans-serif;
      --font-u: "Inter Tight", system-ui, sans-serif;
      --font-m: "JetBrains Mono", monospace;
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-u);
      background: var(--petrol);
      color: var(--cream);
      line-height: 1.6;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 20px;
      padding: 0 48px; height: 64px;
      background: rgba(10,31,33,.9); backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(111,181,172,.08);
    }
    .nav-wm {
      font-family: var(--font-d); font-weight: 900; font-size: 20px;
      letter-spacing: -.03em; color: var(--cream);
      display: flex; align-items: center; gap: 9px; text-decoration: none; flex-shrink: 0;
    }
    .nav-wm svg { height: 19px; width: auto; }
    .nav-wm .ia { color: var(--vermillion); }
    .nav-crumb {
      font-family: var(--font-m); font-size: 11.5px; color: var(--cream-35);
      display: flex; align-items: center; gap: 8px;
    }
    .nav-crumb a { color: var(--cream-35); text-decoration: none; }
    .nav-crumb a:hover { color: var(--cream-60); }
    .nav-back {
      margin-left: auto;
      font-size: 13px; font-weight: 500; color: var(--cream-60);
      text-decoration: none; display: flex; align-items: center; gap: 6px;
    }
    .nav-back:hover { color: var(--cream); }

    /* ── HERO ── */
    .hero { position: relative; }
    .hero-media {
      position: relative;
      aspect-ratio: 2 / 1;
      max-height: 520px; min-height: 260px;
      overflow: hidden;
    }
    .hero-art { position: absolute; inset: 0; }
    .hero-art svg, .hero-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-shade {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(10,31,33,.2) 0%, rgba(10,31,33,.55) 55%, var(--petrol) 100%),
        linear-gradient(90deg, rgba(10,31,33,.85) 0%, rgba(10,31,33,.15) 60%);
    }
    .hero-badges {
      position: absolute; top: 20px; left: 20px; z-index: 2;
      display: flex; gap: 8px;
    }
    .badge {
      font-family: var(--font-m); font-size: 10px; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 5px 11px; border-radius: 4px;
      background: var(--vermillion); color: #fff;
    }
    .badge.teal { background: rgba(111,181,172,.9); color: var(--petrol); }
    .badge.ghost { background: rgba(10,31,33,.7); color: var(--cream-60); border: 1px solid var(--cream-15); }

    /* modo overlay (padrão): texto sobre a imagem, ancorado embaixo */
    .hero-text {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 1;
      padding: 0 48px 40px; max-width: 720px;
    }

    /* modo empilhado: banners com título já embutido na foto — texto some da imagem e vai abaixo, sem duplicar */
    .hero.stacked .hero-media { aspect-ratio: 16 / 9; max-height: 460px; }
    .hero.stacked .hero-shade { background: linear-gradient(180deg, transparent 75%, var(--petrol) 100%); }
    .hero.stacked .hero-text {
      position: static; max-width: 720px;
      padding: 36px 48px 8px; background: var(--petrol);
    }

    .hero-kicker {
      font-family: var(--font-m); font-size: 11px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--sinal); margin-bottom: 14px;
    }
    .hero h1 {
      font-family: var(--font-d); font-weight: 900;
      font-size: clamp(30px, 4.4vw, 48px);
      letter-spacing: -.03em; line-height: 1.03; margin: 0 0 16px;
    }
    .hero h1 em { font-style: normal; color: var(--vermillion); }
    .hero-desc { font-size: 15.5px; color: var(--cream-60); max-width: 560px; margin: 0 0 28px; }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--font-d); font-weight: 700; font-size: 15px;
      letter-spacing: -.01em; text-decoration: none;
      padding: 14px 26px; border-radius: 8px; border: none; cursor: pointer;
      transition: transform .15s var(--ease), background .15s var(--ease), opacity .15s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-play { background: var(--cream); color: var(--petrol); }
    .btn-play:hover { background: #fff; }
    .btn-soon {
      background: rgba(242,237,227,.08); color: var(--cream-60);
      border: 1px solid rgba(242,237,227,.16); cursor: default;
    }
    .btn-soon:hover { transform: none; }
    .hero-note { font-family: var(--font-m); font-size: 11px; color: var(--cream-35); letter-spacing: .04em; }

    /* ── CONTENT ── */
    .content { max-width: 980px; margin: 0 auto; padding: 56px 48px 90px; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel {
      background: var(--petrol-mid);
      border: 1px solid rgba(111,181,172,.1);
      border-radius: 14px;
      padding: 30px 32px;
    }
    .panel-title {
      font-family: var(--font-d); font-weight: 800; font-size: 17px;
      letter-spacing: -.02em; margin: 0 0 18px;
      display: flex; align-items: center; gap: 10px;
    }
    .panel-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sinal); flex-shrink: 0; }
    .bullets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
    .bullets li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--cream-60); line-height: 1.55; }
    .bullets .ic {
      flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
      background: rgba(111,181,172,.12); color: var(--sinal);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; margin-top: 1px;
    }
    .topics { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
    .topics li {
      display: flex; gap: 14px; align-items: baseline;
      font-size: 14px; color: var(--cream-60);
      padding: 12px 0; border-bottom: 1px solid rgba(111,181,172,.08);
    }
    .topics li:last-child { border-bottom: none; padding-bottom: 0; }
    .topics li:first-child { padding-top: 0; }
    .topics .n {
      font-family: var(--font-m); font-size: 11px; color: var(--sinal);
      flex-shrink: 0; min-width: 20px;
    }

    .footer {
      border-top: 1px solid rgba(111,181,172,.08);
      padding: 30px 48px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; flex-wrap: wrap;
    }
    .footer-wm {
      font-family: var(--font-d); font-weight: 800; font-size: 16px;
      letter-spacing: -.02em; color: var(--cream);
      display: flex; align-items: center; gap: 9px;
    }
    .footer-wm svg { height: 16px; width: auto; }
    .footer-wm span { color: var(--vermillion); }
    .footer-copy { font-family: var(--font-m); font-size: 11px; color: var(--cream-35); letter-spacing: .06em; }

    @media (max-width: 760px) {
      .nav, .footer { padding-left: 20px; padding-right: 20px; }
      .nav-crumb { display: none; }
      .hero-text { padding: 0 20px 30px; }
      .hero.stacked .hero-text { padding: 26px 20px 8px; }
      .content { padding: 40px 20px 70px; }
      .panels { grid-template-columns: 1fr; }
    }
  </style>
</head>

function render() {
  const params = new URLSearchParams(location.search);
  const slug = params.get('m');
  const data = MODULES[slug];

  if (!data) {
    location.href = '/aplicativo';
    return;
  }

  const cat = CATEGORIES[data.category];

  document.title = `${data.title.replace(/<[^>]+>/g, '')} · marketeia`;

  document.getElementById('crumb').innerHTML =
    `<a href="/aplicativo">Aplicativo</a><span>／</span><a href="${cat.anchor}">${cat.label}</a>`;

  document.getElementById('heroArt').innerHTML =
    data.art.type === 'svg' ? data.art.content : `<img src="${data.art.src}" alt="" />`;

  document.getElementById('hero').classList.toggle('stacked', data.art.type === 'img');

  document.getElementById('heroBadges').innerHTML =
    data.badges.map(b => `<span class="badge ${b.cls || ''}">${b.text}</span>`).join('');

  document.getElementById('heroKicker').textContent = data.kicker;
  document.getElementById('heroTitle').innerHTML = data.title;
  document.getElementById('heroDesc').textContent = data.desc;

  const actions = document.getElementById('heroActions');
  if (data.cta.ready) {
    actions.innerHTML = `<a class="btn btn-play" href="${data.cta.href}"><span>▶</span> ${data.cta.label}</a>`;
  } else {
    actions.innerHTML =
      `<button class="btn btn-soon" type="button" disabled>${data.cta.label}</button>` +
      `<span class="hero-note">Este módulo ainda está em produção — volte em breve.</span>`;
  }

  document.getElementById('bulletsList').innerHTML =
    data.bullets.map(b => `<li><span class="ic">✓</span>${b}</li>`).join('');

  document.getElementById('topicsList').innerHTML =
    data.topics.map((t, i) => `<li><span class="n">${String(i + 1).padStart(2, '0')}</span>${t}</li>`).join('');
}

render();
</script>
